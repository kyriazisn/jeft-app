{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}jeft{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom bg-white">
    <div class="container py-2">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}">jeft</a>
        <div class="d-flex gap-2 align-items-center">
            <a class="btn btn-outline-dark btn-sm" href="#requests">Discover</a>
            {% if user.is_authenticated %}
                <span class="small text-muted">@{{ user.username }}</span>
                <a class="btn btn-outline-dark btn-sm" href="{% url 'logout' %}">Sign out</a>
            {% else %}
                <a class="btn btn-outline-dark btn-sm" href="{% url 'login' %}">Sign in</a>
                <a class="btn btn-dark btn-sm" href="{% url 'signup' %}">Create account</a>
            {% endif %}
            <a class="btn btn-dark btn-sm" href="#create">Create a request</a>
        </div>
    </div>
</nav>
<main>{% block content %}{% endblock %}</main>
<footer class="border-top mt-5 py-4 text-muted"><div class="container small">A privacy-first way to fulfill meaningful requests.</div></footer>
</body>
</html>
